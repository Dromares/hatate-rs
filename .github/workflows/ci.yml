name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The window crate builds against GTK 4.14 / libadwaita 1.5 (the toolkit this image ships) and
      # its scenarios run under a virtual display.
      - name: GTK build dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev xvfb fontconfig
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `HATATE_GTK_SMOKE=1` turns the window scenarios on. With `CI` set (it always is here) a
      # missing flag or a missing display fails the test instead of skipping it. `HATATE_SMOKE_XVFB=1`
      # states that the display is the Xvfb `xvfb-run` starts here; the key injector refuses without
      # it and without an `xvfb-run` Xauthority (DAN-2264), so it can never type into a live session.
      - name: cargo test --workspace (under Xvfb)
        env:
          HATATE_GTK_SMOKE: "1"
          HATATE_SMOKE_XVFB: "1"
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a -s "-screen 0 1440x900x24" cargo test --workspace
      # The shot set on this toolkit (GTK 4.14 / libadwaita 1.5), dark and light, for the design
      # read: `examples/shot.rs` renders the real window over a synthetic temp profile. The
      # numbers in `docs/gtk-shell.md` and the contrast table come from these, not from a host
      # with a newer toolkit.
      - name: Shot set (under Xvfb)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: |
          cargo build -p hatate-gtk --example shot
          mkdir -p shots
          shot() { xvfb-run -a -s "-screen 0 1440x900x24" target/debug/examples/shot "$@"; }
          for s in dark light; do
            for st in empty rows crashed survived quota dialog dialog-nolabel logs logs-selected logs-selected-body menu menu-hover focus focus-files focus-folder hover-folder failed activity parser-health review review-empty review-nomatch review-picker review-addtags review-conditions review-focus-combo review-focus-mark review-focus-next review-focus-addtags review-focus-taglist review-focus-view review-wipe review-differences review-wipe-nomatch review-error review-focus-wslider review-focus-wview review-focus-zoom review-focus-popout review-compare review-compare-differences review-compare-nomatch review-focus-compare-slider review-focus-compare-diff hydrus-empty hydrus-delete hydrus-query hydrus-query-results hydrus-query-focus pawchive pawchive-artists hydrus-delete-confirm settings-0 settings-1 settings-2 settings-3 settings-4 settings-5 settings-6 settings-7 settings-8 settings-find settings-find-none settings-found settings-lens settings-focus-find settings-focus-tab settings-focus-ok settings-focus-cancel settings-focus-check settings-focus-spin settings-focus-combo settings-focus-entry settings-mcp-running settings-mcp-held settings-mcp-audit settings-shortcuts-conflict settings-shortcuts-record settings-focus-mcp settings-focus-shortcut; do
              shot "shots/$st-$s.png" "$s" 1100x800 "$st"
            done
            for st in empty failed activity parser-health quota review review-empty review-nomatch review-picker review-addtags review-conditions review-focus-mark review-wipe review-differences review-wipe-nomatch review-error review-focus-wslider hydrus-empty hydrus-delete hydrus-query hydrus-query-results hydrus-query-focus pawchive pawchive-artists hydrus-delete-confirm settings-0 settings-1 settings-2 settings-3 settings-4 settings-5 settings-6 settings-7 settings-8 settings-find settings-find-none settings-found settings-lens settings-mcp-running settings-mcp-held settings-mcp-audit settings-shortcuts-conflict settings-shortcuts-record; do
              shot "shots/$st-min-$s.png" "$s" min "$st"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          retention-days: 14
