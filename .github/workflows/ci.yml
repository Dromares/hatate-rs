name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The window crate builds against GTK 4.14 / libadwaita 1.5 (the toolkit this image ships) and
      # its scenarios run under a virtual display.
      - name: GTK build dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev xvfb fontconfig
      # The Python repo at the commit the port is pinned to, read-only: the presubmit gate walks its
      # `tests/test_*.py` (`crates/hatate-doccite/tests/presubmit.rs`). Public, so no token is needed.
      - uses: actions/checkout@v4
        with:
          repository: Dromares/Hatate-Linux-Redux
          ref: 76c85c44fea050e06ae91c77ecc5b40e2f23f986
          path: py-oracle
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `HATATE_GTK_SMOKE=1` turns the window scenarios on. With `CI` set (it always is here) a
      # missing flag or a missing display fails the test instead of skipping it. `HATATE_SMOKE_XVFB=1`
      # states that the display is the Xvfb `xvfb-run` starts here; the key injector refuses without
      # it and without an `xvfb-run` Xauthority (DAN-2264), so it can never type into a live session.
      - name: cargo test --workspace (under Xvfb)
        env:
          HATATE_GTK_SMOKE: "1"
          HATATE_SMOKE_XVFB: "1"
          HATATE_PY_ORACLE: ${{ github.workspace }}/py-oracle
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a -s "-screen 0 1440x900x24" cargo test --workspace
      # The shot set on this toolkit (GTK 4.14 / libadwaita 1.5), dark and light, for the design
      # read: `examples/shot.rs` renders the real window over a synthetic temp profile. The
      # numbers in `docs/gtk-shell.md` and the contrast table come from these, not from a host
      # with a newer toolkit.
      - name: Shot set (under Xvfb)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: |
          cargo build -p hatate-gtk --example shot
          # The renderer walks its own state table (`SHOT_SET` in `examples/shot.rs`) and writes
          # `shots/index.tsv`: each PNG's header size next to the size its surface states as its minimum.
          xvfb-run -a -s "-screen 0 1440x900x24" target/debug/examples/shot --all shots
          # An unknown state name fails loudly and writes nothing (Python's `render_states.py` did).
          if xvfb-run -a -s "-screen 0 1440x900x24" target/debug/examples/shot /tmp/nope.png dark 1100x800 no-such-state; then
            echo "shot accepted an unknown state"; exit 1
          fi
          test ! -e /tmp/nope.png
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          retention-days: 14

  # The AppImage (DAN-2499, Phase 7): built once per run, here, and uploaded as the artifact the
  # later steps download. `cargo run -p xtask -- appimage` is the whole recipe (no script); every
  # external input is pinned by URL and sha256 in `packaging/appimage/pins.toml`. This job only
  # reads the repository (`contents: read`) and creates no tag, release or token write.
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The build bundles GTK 4.14 / libadwaita 1.5 and Chromium's shared libraries out of this
      # image (`ldd` over the binaries), plus the pixbuf SVG loader, the schemas, the Adwaita
      # icons and DejaVu as the fallback face. `squashfs-tools` is for `appimagetool`.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme fonts-dejavu-core \
            libglib2.0-bin squashfs-tools unzip curl \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2t64 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libxcb1 \
            libdrm2 libdbus-1-3 libatspi2.0-0
      - name: Build Hatate-x86_64.AppImage
        run: cargo run -p xtask -- appimage --out "$RUNNER_TEMP/appimage"
      # No FUSE on the runner: the AppImage extracts itself and runs from there. `--version` is
      # answered by the CLI inside the image and must say work in progress.
      - name: The image answers --version
        run: |
          cd "$RUNNER_TEMP/appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 ./Hatate-x86_64.AppImage --version | tee version.txt
          grep -q 'work-in-progress' version.txt
          sha256sum Hatate-x86_64.AppImage | tee SHA256SUMS
          ls -l Hatate-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            ${{ runner.temp }}/appimage/Hatate-x86_64.AppImage
            ${{ runner.temp }}/appimage/SHA256SUMS
          retention-days: 14
