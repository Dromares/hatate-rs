name: release

# The release workflow (DAN-2503, Phase 7.d). It never publishes. The only thing it can create is a
# DRAFT GitHub Release carrying `Hatate-x86_64.AppImage` and `SHA256SUMS`; making a release public is
# a separate step by a person, after the draft check and the board's OK (RELEASING.md, section 6).
# A draft has no tag either: GitHub creates the tag when the draft is published.
#
# Two ways in:
#   - `workflow_dispatch` on `main` (Actions > release > Run workflow, version 0.2.0): build, checksum,
#     then create the draft. Dispatch only after step 7.d has merged: GitHub runs a dispatch workflow
#     only if its file is on the default branch.
#   - `pull_request` (only when a file the build reads changes): a dry run that builds and checksums
#     and stops there. The `draft` job is skipped, and the token of a pull request cannot write.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to draft. Must equal [workspace.package] version in Cargo.toml."
        required: true
        default: "0.2.0"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      - "packaging/**"
      - "crates/hatate-apprun/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The version is the workspace version, never an input that can disagree with it.
      - name: The version to build
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$v"
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$INPUT_VERSION" = "$v" || { echo "input $INPUT_VERSION is not the workspace version $v"; exit 1; }
            test "$REF" = refs/heads/main || { echo "dispatch from main only, not $REF"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v, event $EVENT, commit $GITHUB_SHA"
      # The same dependencies as the `appimage` job of ci.yml: the build bundles GTK 4.14 /
      # libadwaita 1.5 and Chromium's shared libraries out of this image.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme fonts-dejavu-core \
            libglib2.0-bin squashfs-tools unzip curl \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2t64 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libxcb1 \
            libdrm2 libdbus-1-3 libatspi2.0-0
      - name: Build Hatate-x86_64.AppImage
        shell: bash
        run: cargo run -p xtask -- appimage --out "$RUNNER_TEMP/release" 2>&1 | tee "$RUNNER_TEMP/build.log"
      # No FUSE on the runner: the image extracts itself and runs from there.
      - name: The image answers --version
        run: |
          cd "$RUNNER_TEMP/release"
          APPIMAGE_EXTRACT_AND_RUN=1 ./Hatate-x86_64.AppImage --version | tee version.txt
          test "$(cat version.txt)" = "hatate ${{ steps.version.outputs.version }} (Rust rewrite of Hatate)"
      - name: SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum Hatate-x86_64.AppImage | tee SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l Hatate-x86_64.AppImage SHA256SUMS
          {
            echo "### release build ${{ steps.version.outputs.version }} (${{ github.event_name }})"
            echo "commit \`$GITHUB_SHA\`"
            echo '```'
            cat SHA256SUMS
            ls -l Hatate-x86_64.AppImage
            grep 'build host libc' "$RUNNER_TEMP/build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The notes are written here, from the build's own output, so the draft carries the size, the
      # glibc floor, the checksum and the licence line RELEASING.md asks for.
      - name: Release notes
        run: |
          cd "$RUNNER_TEMP/release"
          size=$(stat -c %s Hatate-x86_64.AppImage)
          sum=$(cut -d' ' -f1 SHA256SUMS)
          libc=$(grep 'build host libc' "$RUNNER_TEMP/build.log" | head -1 | sed 's/.*(the image.s glibc floor): //')
          {
            echo "Hatate ${{ steps.version.outputs.version }}, the Rust rewrite of Hatate."
            echo
            echo "- File: \`Hatate-x86_64.AppImage\`, $size bytes. SHA-256: \`$sum\`."
            echo "- x86_64 Linux. glibc floor: that of the build host (\`${libc}\`)."
            echo "- Verify with \`sha256sum -c --ignore-missing SHA256SUMS\`, then \`chmod +x\` and run."
            echo "- Known gaps: see the README at this commit."
            echo "- Source: commit \`$GITHUB_SHA\`."
            echo
            echo "Hatate's own code is MIT; the AppImage also bundles Chromium, GTK 4 and libadwaita and other components under their own licences, listed in \`NOTICE\`."
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/release/Hatate-x86_64.AppImage
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/notes.md
            ${{ runner.temp }}/build.log
          retention-days: 14

  # Only a dispatch gets here. It creates one DRAFT release and nothing else: no tag is pushed, and
  # nothing is made public. If a release (draft or published) for the version already exists, it stops.
  draft:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # upload-artifact roots the artifact at the common parent of its files. `build.log` sits in
          # $RUNNER_TEMP and the three assets in $RUNNER_TEMP/release, so the root is $RUNNER_TEMP and
          # the assets land in assets/release/ (v0.2.0 dispatch, run 41273051528). `build.log` is
          # never named below, so it cannot become a release asset.
          cd assets/release
          sha256sum -c SHA256SUMS
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release v$VERSION already exists; this workflow does not touch it"; exit 1
          fi
          gh release create "v$VERSION" Hatate-x86_64.AppImage SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Hatate $VERSION" --notes-file notes.md
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets \
            --jq '"isDraft=\(.isDraft) tag=\(.tagName) assets=\([.assets[].name] | join(","))"' | tee -a "$GITHUB_STEP_SUMMARY"
