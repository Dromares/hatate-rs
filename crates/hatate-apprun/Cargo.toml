[package]
name = "hatate-apprun"
description = "The AppImage's AppRun: sets the bundled environment and starts the Hatate window or command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is named `AppRun`, the name every AppImage runtime executes. No dependencies: it runs
# before anything else in the image, so it uses only `std`.
[[bin]]
name = "AppRun"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
