[package]
name = "hatate-core"
description = "Shared library for the Hatate Rust rewrite (work in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
http = "1"
# rustls with NO built-in provider: reqwest then reads the process-wide default
# provider, which `net::install_crypto_provider` installs explicitly (DAN-1909).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "gzip", "deflate", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
tower = { version = "0.5", default-features = false, features = ["retry", "util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rcgen = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
