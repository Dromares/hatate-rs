[package]
name = "hatate-core"
description = "Shared library for the Hatate Rust rewrite (work in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
# CRC-32 of PNG chunks, for `pymeta` (Pillow checks every chunk before the pixel data). Already in
# the lockfile through `png`, so no new crate is built.
crc32fast = "1"
# zlib inflate of PNG text and ICC chunks, for `pymeta`. Already in the lockfile through `png`.
flate2 = "1"
http = "1"
http-body-util = "0.1"
# The MCP server's HTTP/1 listener (loopback), the same hyper reqwest already builds.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# NFKC for `pyurl`'s netloc check (`urllib.parse._checknetloc`). Already in the lockfile through
# `url` -> `idna`, so no new crate is built.
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico", "pnm", "tga"] }
jpeg-encoder = "0.6.1"
getrandom = "0.4"
libc = "0.2"
# The WHATWG named-character-reference table, for `pycompat::html_unescape`. Already in the
# lockfile through scraper's html5ever, so no new crate.
markup5ever = "0.40"
# MD5 for `local_md5` (Sankaku finds a post by the local file's hash). Same RustCrypto family and
# `digest` as the dev-only `sha2`.
md-5 = "0.10"
regex = "1.13.1"
# rustls with NO built-in provider: reqwest then reads the process-wide default
# provider, which `net::install_crypto_provider` installs explicitly (DAN-1909).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "gzip", "deflate", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29.0"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
tower = { version = "0.5", default-features = false, features = ["retry", "util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tempfile = "3.27.0"
