[package]
name = "hatate-gtk"
description = "GTK4 toolkit spike for the Hatate Rust rewrite: Review view and a 5,000-row Queue (work in progress)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Aligned with Dromares/rv-rs crates/rv-gtk (gtk4 0.11.5, feature v4_12). rv-gtk does not use
# libadwaita; the spike adds it to measure how its stylesheet fights the flat Ryoku look.
gtk4 = { version = "0.11.5", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
# PNG and JPEG only: enough for the fixtures and for the load-failure path.
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lib]
name = "hatate_gtk"
path = "src/lib.rs"

[[bin]]
name = "hatate-gtk"
path = "src/main.rs"

# Needs a display, so it is its own program: it runs when HATATE_GTK_SMOKE=1 (CI sets it, under
# xvfb-run) and says so and passes otherwise. GTK must also run on the main thread, which the
# default test harness does not give a test.
[[test]]
name = "smoke"
path = "tests/smoke.rs"
harness = false
